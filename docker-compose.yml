services:
  db:
    container_name: Marcai-back-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [brutus]

  # O Django. Estagio unico, por isso a chave `target` do front (que tem
  # `dev`) nao existe aqui — nao ha o que escolher.
  api:
    container_name: Marcai-back-api
    build: { context: . }
    environment:
      PGDATABASE: brutus
      PGHOST: db
      PGPORT: "5432"
      DOMINIO_BASE: localhost
      DJANGO_DEBUG: "1"
      REDIS_URL: redis://redis:6379/1
      # Do .env do host. Sem esta linha, settings.py:8 cai no padrão
      # "inseguro-so-em-dev" e nada quebra — que é justamente o perigo.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY no .env}
      # O MESMO valor do .env do front. O cookie de sessao e emitido por um
      # lado e lido pelo outro durante a travessia: segredos diferentes
      # deslogam todo mundo a cada rota que atravessa.
      SESSAO_JWT_SECRET: ${SESSAO_JWT_SECRET:?defina SESSAO_JWT_SECRET no .env}
      # O MESMO valor do .env do front, como o SESSAO_JWT_SECRET acima: o
      # Django emite o cookie do admin e o proxy.ts do front o le.
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?defina ADMIN_JWT_SECRET no .env}
      # SEM `:?`, ao contrario da de cima: sem estas duas o login apenas nega,
      # e subir o back sem admin configurado e um estado valido.
      ADMIN_USUARIO: ${ADMIN_USUARIO}
      # As DUAS formas de configurar a senha; o hash tem precedencia. Sem `:?`
      # como as de cima: subir sem admin configurado e um estado valido (o
      # login apenas nega). Ver app/services/admin_senha.py.
      ADMIN_SENHA_HASH_B64: ${ADMIN_SENHA_HASH_B64:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      # Nome de servico, resolvivel so DENTRO da rede do compose — igual ao
      # `app` do front. As rotas do painel (fatia 4) mandam WhatsApp
      # fire-and-forget (confirmacao, cancelamento, convite); sem isto o envio
      # cai no log (`app/services/whatsapp.py`), o mesmo comportamento do
      # front quando falta EVOLUTION_API_URL.
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-brutus}
      # Onde o link do convite abre — o FRONT, nunca o Django. Espelha
      # NEXT_PUBLIC_URL_BASE do outro lado; as duas tem que apontar para a
      # mesma origem, senao o convite emitido por um lado leva a um link que
      # o outro nao serve.
      URL_BASE: ${URL_BASE:-http://localhost:3000}
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      db: { condition: service_healthy }
    # Fatia 8: `barbeariaAtual()` e a pagina de agendamento do front agora
    # rodam server-side, DENTRO do contêiner `Marcai-front-app`, e montam a
    # origem do Django a partir do Host da propria requisicao — o mesmo
    # `brutus.localhost`/`dontony.localhost` que o navegador usa. Sem estes
    # apelidos, esse nome so resolveria no NAVEGADOR (via /etc/hosts ou DNS
    # de *.localhost), nunca de dentro de outro contêiner — e forjar o header
    # Host no fetch não funciona: o fetch do Node ignora um Host forjado, e
    # ainda que não ignorasse, `ALLOWED_HOSTS` do Django (`tenant/
    # middleware.py`) so aceita o Host que a CONEXAO TCP realmente usou.
    # O que isto compra: o nome do tenant resolve para ESTE contêiner de
    # dentro da rede do compose, então a URL que o front monta (Host =
    # tenant) chega aqui sem precisar mentir em lugar nenhum — Django
    # resolve o tenant normalmente, do jeito que já fazia para o navegador.
    # O custo: isto é SÓ DE DEV. Em produção esses nomes são DNS público de
    # verdade, apontando pra fora, não um apelido de rede Docker. E custa
    # MANUTENÇÃO: é uma linha por tenant — uma barbearia criada pelo painel
    # do admin em dev não ganha apelido sozinha, e as páginas dela falham
    # (fetch sem ninguém escutando) até alguém acrescentar a linha aqui à
    # mão e subir o compose de novo.
    networks:
      brutus:
        aliases:
          - brutus.localhost
          - dontony.localhost
          # Criada pelo admin em 02/09; a linha e' o preco descrito acima.
          - znt.localhost

  # O telefone do produto. Confirmação, cancelamento, lembrete e convite de
  # barbeiro saem por aqui — sem este serviço, tudo isso cai no console.info do
  # app e o sistema funciona inteiro sem falar com ninguém.
  #
  # Versão PINADA: `latest` num serviço que guarda sessão de WhatsApp é convite
  # para uma atualização derrubar a conexão numa terça à tarde.
  evolution:
    container_name: Marcai-back-evolution
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      # A parte que mais importa: aqui mora a credencial da sessão que o QR
      # gera. Sem o volume, todo `docker compose down` obriga a escanear o QR
      # de novo — em produção, é o telefone da barbearia caindo a cada deploy.
      - evolution_instances:/evolution/instances
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      # O Postgres que já existe, com papel e banco próprios (docker/init-db.sql).
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: brutus
      # Só a instância é persistida. Todo o resto FICA DESLIGADO de propósito:
      # nós mandamos mensagem e consultamos se um número existe — nunca lemos
      # conversa. Ligado, isto guardaria mensagens, contatos, chats e histórico
      # de todo cliente de toda barbearia: um acervo de conversa alheia que o
      # produto não usa para nada.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Estes DOIS andam juntos, e isso foi medido: com `NEW_MESSAGE=false`, a
      # `MessageUpdate` também fica vazia — o status precisa da linha da
      # mensagem para pousar. Não existe "só o status".
      #
      # E o status é o ÚNICO lugar onde aparece que o WhatsApp **recusou** o
      # envio. A Evolution devolve `201` porque aceitou a TAREFA; a rejeição
      # chega depois, assíncrona, como `status: ERROR`. Com isto desligado, ela
      # não tinha onde pousar — e em 10/08 custou horas de investigação com log
      # limpo dos dois lados e mensagem nenhuma chegando.
      #
      # O que fica guardado é o texto que NÓS mandamos (confirmação, lembrete,
      # convite). Mensagem de cliente não entra: o produto nunca recebe, e
      # contatos, chats e histórico seguem desligados abaixo.
      #
      # O `zelador` poda o que passa de 7 dias.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      # COM Redis, e a decisão anterior estava errada. Eu havia desligado com o
      # argumento de que "um quarto contêiner para cachear o que uma instância
      # única resolve em memória é peso sem retorno" — raciocínio sobre CACHE,
      # quando o Redis aqui é infraestrutura de ENVIO.
      #
      # O sintoma: mensagem aceita com `201 / status: PENDING` e nunca
      # transmitida, com a instância `open` e o soquete respondendo. No log da
      # Evolution, a cada envio: `CACHE: { cached: undefined, messageTimestamp:
      # undefined }` seguido de `Closing session`. Mensagem à mão pelo celular
      # chegava; pela API, nunca.
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [brutus]

  worker:
    container_name: Marcai-back-worker
    build: { context: . }
    # `-Q celery` explicito: fila padrao com nome escrito e uma fila a menos
    # para descobrir no dia em que houver duas.
    command: celery -A backend worker -l info -Q celery
    environment: &ambiente_django
      PGDATABASE: brutus
      PGHOST: db
      PGPORT: "5432"
      DOMINIO_BASE: localhost
      REDIS_URL: redis://redis:6379/1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY no .env}
      # O MESMO valor do .env do front. O cookie de sessao e emitido por um
      # lado e lido pelo outro durante a travessia: segredos diferentes
      # deslogam todo mundo a cada rota que atravessa.
      SESSAO_JWT_SECRET: ${SESSAO_JWT_SECRET:?defina SESSAO_JWT_SECRET no .env}
      # Fatia 7: o `worker` PASSA A PRECISAR falar com a Evolution — a
      # tarefa `lembretes` manda WhatsApp (`enviar_texto`) e a
      # `whatsapp_healthcheck` confere `connectionState`. Antes, so' o `api`
      # tinha estas tres (linhas ~35-37).
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-brutus}
    volumes: [".:/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      evolution: { condition: service_started }
    networks: [brutus]

  beat:
    container_name: Marcai-back-beat
    build: { context: . }
    # O agendador de ARQUIVO (padrao do Celery). O django-celery-beat, que
    # guarda a agenda em tabela, so entra na fatia 8: aqui ele criaria tabela
    # num banco de que o Prisma e dono.
    command: celery -A backend beat -l info --schedule=/tmp/celerybeat-schedule
    environment: *ambiente_django
    volumes: [".:/app"]
    depends_on:
      redis: { condition: service_started }
    networks: [brutus]

  # Não é cache de conveniência: a Evolution usa o Redis no caminho de ENVIO.
  # Sem ele, a mensagem é aceita (`201 / PENDING`) e nunca transmitida.
  # `appendonly` para a fila sobreviver a reinício do contêiner.
  redis:
    container_name: Marcai-back-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    networks: [brutus]

volumes:
  pgdata:
  evolution_instances:
  evolution_redis:

# `external: true` porque a rede é criada à mão e vive mais que qualquer um dos
# dois composes. Se o compose a criasse, ela morreria no `down` de quem a criou
# e o outro lado perderia o banco no meio do trabalho.
networks:
  brutus:
    external: true
