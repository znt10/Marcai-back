# Ambiente de TESTE no mesmo servidor da produção, num recurso separado do
# Coolify: `*.preview.usemarcai.online`. Serve para abrir uma branch no celular
# antes do merge. O passo a passo está em `docs/ambiente-preview.md`.
#
# É o `docker-compose.prod.yml` com cinco diferenças, e cada uma existe para
# o teste não encostar na produção:
#
#   - As etiquetas do Traefik têm nomes PRÓPRIOS (`marcai-preview-*`). Com os
#     mesmos nomes da produção, os dois recursos disputariam o mesmo roteador
#     e as barbearias de verdade poderiam cair no site do teste.
#   - A regra casa só `<algo>.preview.usemarcai.online`. A da produção
#     (`^[a-z0-9-]+\.usemarcai\.online\z`) não casa esses endereços, porque o
#     `[a-z0-9-]+` não aceita ponto: os dois conjuntos não se cruzam.
#   - Sem Evolution própria. Com `EVOLUTION_API_URL` vazia (o padrão), nenhuma
#     mensagem sai: o texto (código da conta, confirmação, lembrete) vai para o
#     log do `api`. Para receber de verdade no celular, a Env do recurso pode
#     apontar para a Evolution da PRODUÇÃO (`http://evolution:8080`, que a
#     rede em comum do Coolify alcança) com a `EVOLUTION_API_KEY` de lá. O chip
#     é o mesmo: as mensagens saem pelo número central da produção.
#   - Serviços com nomes próprios (`preview-db`, `preview-api`,
#     `preview-redis`). O Coolify põe os dois recursos numa rede em comum
#     com o proxy, e lá `db` e `api` respondiam pelo contêiner da PRODUÇÃO:
#     no primeiro deploy o `api` daqui tentou entrar no banco de lá e levou
#     "password authentication failed".
#   - Banco, Redis e volumes próprios. O Coolify prefixa os volumes com o id
#     do recurso, então o `pgdata` daqui não é o da produção.
#
# Para testar uma branch: no recurso, trocar o "Git Branch" (back) e a
# variável `FRONT_BRANCH` (front), e clicar em Deploy.

x-django: &django
  build: { context: . }
  restart: unless-stopped
  environment:
    PGDATABASE: brutus
    PGHOST: preview-db
    PGPORT: "5432"
    PGPASSWORD_OWNER: ${PGPASSWORD_OWNER:?}
    PGPASSWORD_APP: ${PGPASSWORD_APP:?}
    PGPASSWORD_ADMIN: ${PGPASSWORD_ADMIN:?}
    DJANGO_DEBUG: "0"
    DOMINIO_BASE: ${DOMINIO_BASE:?}
    REDIS_URL: redis://preview-redis:6379/1
    CACHE_REDIS_URL: redis://preview-redis:6379/2
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
    SESSAO_JWT_SECRET: ${SESSAO_JWT_SECRET:?}
    ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
    ADMIN_USUARIO: ${ADMIN_USUARIO:-}
    ADMIN_SENHA_HASH_B64: ${ADMIN_SENHA_HASH_B64:-}
    PROXY_SEGREDO: ${PROXY_SEGREDO:?}
    # Vazia por padrão: é o que faz o envio só registrar no log.
    EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
    EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-Marcai}
    # API oficial da Meta. Vazias = tudo pela Evolution, como antes
    # (ver `.env.example`).
    WHATSAPP_PROVEDOR: ${WHATSAPP_PROVEDOR:-}
    META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
    META_WHATSAPP_NUMERO_ID: ${META_WHATSAPP_NUMERO_ID:-}
    META_WHATSAPP_TEMPLATE: ${META_WHATSAPP_TEMPLATE:-}
    META_WHATSAPP_TEMPLATE_IDIOMA: ${META_WHATSAPP_TEMPLATE_IDIOMA:-pt_BR}
    META_TEMPLATE_CONFIRMACAO: ${META_TEMPLATE_CONFIRMACAO:-}
    META_TEMPLATE_LEMBRETE: ${META_TEMPLATE_LEMBRETE:-}
    META_TEMPLATE_CANCELAMENTO: ${META_TEMPLATE_CANCELAMENTO:-}
    META_GRAPH_VERSAO: ${META_GRAPH_VERSAO:-v21.0}
    META_WEBHOOK_TOKEN: ${META_WEBHOOK_TOKEN:-}
    META_APP_SECRET: ${META_APP_SECRET:-}
    URL_BASE: https://${DOMINIO_BASE}

services:
  preview-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      PGPASSWORD_OWNER: ${PGPASSWORD_OWNER:?}
      PGPASSWORD_APP: ${PGPASSWORD_APP:?}
      PGPASSWORD_ADMIN: ${PGPASSWORD_ADMIN:?}
      # O `init-db.sh` cria o papel da Evolution mesmo sem ela. Ninguém usa
      # este papel aqui, então o padrão basta.
      PGPASSWORD_EVOLUTION: ${PGPASSWORD_EVOLUTION:-sem-evolution}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  preview-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data

  preview-api:
    <<: *django
    # Dois workers, e não três: o teste divide a máquina com a produção.
    command: ["gunicorn", "backend.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]
    depends_on:
      preview-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Worker e beat ficam: os avisos e os lembretes passam pela fila do Celery,
  # e sem eles o log não mostraria o que sairia pelo WhatsApp.
  worker:
    <<: *django
    entrypoint: ["/usr/bin/env"]
    command: ["celery", "-A", "backend", "worker", "-l", "info", "-Q", "celery"]
    depends_on:
      preview-api: { condition: service_healthy }

  beat:
    <<: *django
    entrypoint: ["/usr/bin/env"]
    command: ["celery", "-A", "backend", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      preview-api: { condition: service_healthy }

  front:
    build:
      context: https://github.com/znt10/Marcai-front.git#${FRONT_BRANCH:-main}
      target: prod
      args:
        NEXT_PUBLIC_DOMINIO_BASE: ${DOMINIO_BASE:?}
        NEXT_PUBLIC_API_URL: "443"
        NEXT_PUBLIC_URL_BASE: https://${DOMINIO_BASE}
        NEXT_PUBLIC_TENANT_PADRAO: ""
        API_INTERNA_URL: http://preview-api:8000
    restart: unless-stopped
    environment:
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      SESSAO_JWT_SECRET: ${SESSAO_JWT_SECRET:?}
      PROXY_SEGREDO: ${PROXY_SEGREDO:?}
      API_INTERNA_URL: http://preview-api:8000
    depends_on:
      preview-api: { condition: service_healthy }
    # Mesmo arranjo da produção (os motivos estão no `docker-compose.prod.yml`):
    # domínio escrito à mão, porque o Coolify não troca variável dentro de
    # etiqueta, e `\z` no lugar de `$`. O "Domains" do Coolify recebe
    # `https://admin.preview.usemarcai.online`, que é o que liga o proxy à rede
    # deste compose. O raiz `preview.usemarcai.online` NÃO serve: a regra da
    # produção o casa como a barbearia de slug "preview".
    labels:
      - traefik.enable=true
      - traefik.http.services.marcai-preview-front.loadbalancer.server.port=3000
      - traefik.http.middlewares.marcai-preview-https.redirectscheme.scheme=https
      - traefik.http.routers.marcai-preview-subdominios-http.entrypoints=http
      - traefik.http.routers.marcai-preview-subdominios-http.rule=HostRegexp(`^[a-z0-9-]+\.preview\.usemarcai\.online\z`)
      - traefik.http.routers.marcai-preview-subdominios-http.middlewares=marcai-preview-https
      - traefik.http.routers.marcai-preview-subdominios-http.service=marcai-preview-front
      - traefik.http.routers.marcai-preview-subdominios.entrypoints=https
      - traefik.http.routers.marcai-preview-subdominios.rule=HostRegexp(`^[a-z0-9-]+\.preview\.usemarcai\.online\z`)
      - traefik.http.routers.marcai-preview-subdominios.service=marcai-preview-front
      - traefik.http.routers.marcai-preview-subdominios.tls=true
      - traefik.http.routers.marcai-preview-subdominios.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.marcai-preview-subdominios.tls.domains[0].main=*.preview.usemarcai.online

volumes:
  pgdata:
  redis:
