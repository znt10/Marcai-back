[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
python_files = test_*.py
testpaths = tests
pythonpath = backend
; SEM --no-migrations, e essa ausencia e o ponto da fatia 1: as migrations
; PASSARAM a existir, e sao elas que criam o schema, o RLS, o EXCLUDE e os
; GRANTs. Rodar a suite pulando-as testaria um banco que nenhum ambiente tem —
; sem politica de RLS, o test_rls.py provaria isolamento que nao existe.
; PGDATABASE fica SEM o prefixo `D:` de proposito — tem que ganhar de
; QUALQUER coisa que o ambiente ja tenha definido, host ou contêiner, porque
; o teste so pode rodar contra brutus_test, nunca contra brutus (a variavel
; que o docker-compose.yml poe em `api`/`worker`/`beat` para desenvolvimento).
; PGHOST/PGPORT levam `D:` (default: so valem se nada mais ja definiu) porque
; o significado de "onde fica o Postgres" muda com quem chama: no host e
; localhost:5433 (porta publicada do compose), dentro do contêiner `api` e
; db:5432 (ja exportado pelo compose) — sem o prefixo, pytest-env sempre
; sobrescreve com o valor fixo abaixo e `docker compose run --rm api pytest`
; tenta falar com 127.0.0.1:5433 de dentro do contêiner e leva connection
; refused (nao ha nada ouvindo ali dentro).
;
; SESSAO_JWT_SECRET tambem leva `D:`, e pela mesma logica: dentro do contêiner
; o compose ja exporta o segredo de VERDADE (o mesmo do .env do front) e e ele
; que tem que mandar; na maquina nua, onde ninguem exportou nada, este valor de
; fachada e o que deixa a suite rodar. O segredo real nunca pode virar default
; em arquivo versionado - um default assim faria o back aceitar cookie assinado
; com valor publico sem que nada quebrasse, que e o pior jeito de falhar.
env =
    PGDATABASE=brutus_test
    D:PGHOST=localhost
    D:PGPORT=5433
    D:SESSAO_JWT_SECRET=segredo-so-de-teste
    D:ADMIN_JWT_SECRET=segredo-admin-so-de-teste
    ; SEM prefixo `D:`, mesma razao do PGDATABASE acima: a suite do zelador
    ; (fatia 7) so pode rodar contra `evolution_test`, nunca contra
    ; `evolution` — a Evolution de verdade poderia estar rodando e guardando
    ; historico real de mensagem nesse banco.
    PGDATABASE_EVOLUTION=evolution_test
